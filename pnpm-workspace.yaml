packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - "@parcel/watcher"

overrides:
  eslint-plugin-react-hooks: 7.1.1
  # GHSA-rj75-hqrm-r3gf (#289): @tailwindcss/typography@0.5.20 pins 6.0.10 exactly.
  # Remove once a typography release depends on >=6.1.5.
  "@tailwindcss/typography>postcss-selector-parser": 6.1.5
  # GHSA-3g3m-2fjr-6pw4 / GHSA-g3hv-75wg-m249 (#292): fixed only in new majors that
  # @fastify/static (glob@^13), eslint and the sort-imports plugin don't allow yet.
  # Their call sites only use glob() and minimatch()/Minimatch#match(), unchanged in
  # these majors. Remove once those parents' ranges exclude the vulnerable versions
  # (e.g. glob@^14.0.2): pnpm matches declared ranges, so ^14.0.0 still triggers it.
  "glob@<14.0.2": ^14.0.3
  "minimatch@<11.0.1": ^11.0.3

peerDependencyRules:
  allowedVersions:
    "@tailwindcss/vite>vite": "8"
