packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - "@parcel/watcher"

overrides:
  eslint-plugin-react-hooks: 7.1.1
  # GHSA-rj75-hqrm-r3gf (#289): @tailwindcss/typography@0.5.20 pins 6.0.10 exactly.
  # Remove once a typography release depends on >=6.1.5.
  "@tailwindcss/typography>postcss-selector-parser": 6.1.5

peerDependencyRules:
  allowedVersions:
    "@tailwindcss/vite>vite": "8"
